
[colors]
background = #000000
background-alt = #272A2E
foreground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/example]
width = 100%
height = 16pt
radius = 0

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 0pt
border-color = #00000000

module-margin = 1
padding-left = 1
padding-right = 1

separator = 
separator-foreground = ${colors.disabled}

font-0 = "Arimo Nerd Font:style=Bold:size=8;1"

modules-left = applauncher i3
modules-right = filesystem pulseaudio memory cpu date power-menu
modules-center = music

cursor-click = pointer
;cursor-scroll = ns-resize

enable-ipc = true

; tray-position = right

; wm-restack = generic
; wm-restack = bspwm
wm-restack = i3

; override-redirect = true

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/i3]
type = internal/i3

ws-icon-0 = "1;  "
ws-icon-1 = "2;  "
ws-icon-2 = "3;  "
ws-icon-3 = "4;  "
ws-icon-4 = "5;  "
ws-icon-5 = "6;  "

format = <label-mode> <label-state>
label-mode-padding = 3
label-mode-background = ${colors.background-alt}
label-mode-underline= ${colors.primary}
label-mode-foreground = ${colors.foreground}

label-focused = %icon%
label-focused-foreground = ${colors.foreground}
label-focused-underline = ${colors.primary}

label-visible = %icon%
label-visible-foreground = ${colors.disabled}

label-unfocused = "  "
label-unfocused-foreground = ${colors.disabled}

label-urgent = %icon%
label-urgent-foreground = ${colors.disabled}

label-empty = "  "
label-empty-foreground = ${colors.disabled}

label-separator = " "
label-separator-foreground = ${colors.disabled}

;[module/xwindow]
;type = internal/xwindow
;label = %title:0:60:...%

[module/applauncher]
type = custom/text
content = " " 
content-foreground = ${colors.primary}

click-left = exec rofi -show drun

[module/music]
type = custom/script
exec = ~/.config/polybar/scripts/music.sh
tail = true

click-left = ~/.config/polybar/scripts/music.sh left

[module/filesystem]
type = internal/fs
interval = 120

mount-0 = /

format-mounted-prefix = %{F#F0C674}󰉋  %{F-}
label-mounted = %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

use-ui-max = false

format-volume-prefix = "  "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted =   muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 10
format-prefix = "  "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 10
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/date]
type = internal/date
interval = 5

format-prefix = "󰥔  "
format-prefix-foreground = ${colors.primary}

date = %A  -  %H:%M
date-alt = %A, %d %b - %H:%M

label = %date%
label-foreground = ${colors.foreground}

[module/power-menu]
type = custom/text
content = " " 
content-foreground = ${colors.primary}

click-left = ~/.config/polybar/scripts/power-menu.sh

[settings]
screenchange-reload = true
pseudo-transparency = false

throttle-output = 10
throttle-output-for = 15
throttle-input-for = 30

; vim:ft=dosini
